<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сценарная лаборатория Последнего звонка — жанры, стили, концепции</title>
<style>
/* ============================================================
   ПЕРЕМЕННЫЕ + БАЗА (комикс Marvel 80-х: жирные контуры,
   полутоновые точки, смещённые тени, «взрывные» бейджи)
   ============================================================ */
:root{
  --ink:#141019;
  --paper:#fff6df;
  --paper2:#ffeab8;
  --paper3:#f6e2b3;
  --red:#e01b24;
  --red-d:#9e0f18;
  --yellow:#ffc703;
  --yellow-d:#e0a800;
  --blue:#1a4fd6;
  --blue-d:#0d2c80;
  --cyan:#25c2d6;
  --pink:#ff4d97;
  --green:#28b34a;
  --shadow:6px 6px 0 var(--ink);
  --shadow-sm:4px 4px 0 var(--ink);
  --font-d:"Arial Black","Arial Bold",Impact,Haettenschweiler,"Franklin Gothic Heavy",system-ui,sans-serif;
  --font-b:"Trebuchet MS","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  --star:polygon(50% 0%,61% 12%,76% 6%,79% 22%,95% 24%,88% 38%,100% 50%,88% 62%,95% 76%,79% 78%,76% 94%,61% 88%,50% 100%,39% 88%,24% 94%,21% 78%,5% 76%,12% 62%,0% 50%,12% 38%,5% 24%,21% 22%,24% 6%,39% 12%);
  --dots:radial-gradient(circle at 1px 1px, rgba(20,16,25,.18) 1px, transparent 0);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-b);
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, rgba(255,199,3,.35), transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(37,194,214,.30), transparent 45%),
    radial-gradient(circle at 70% 92%, rgba(255,77,151,.25), transparent 45%),
    repeating-linear-gradient(135deg,#fff8e6 0 14px,#fff2d5 14px 28px);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.45;
}
h1,h2,h3,h4{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.5px;line-height:1.05;margin:0}
p{margin:0 0 .6em}
ul,ol{margin:.3em 0 .7em;padding-left:1.15em}
li{margin:.15em 0}
button{font-family:var(--font-d)}
.skip{position:absolute;left:-9999px;top:0;background:var(--yellow);border:3px solid var(--ink);padding:10px 14px;z-index:99;font-weight:700}
.skip:focus{left:8px;top:8px}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:4px solid var(--blue);outline-offset:3px;
}
/* ============================================================
   LAYOUT
   ============================================================ */
#app{max-width:1220px;margin:0 auto;padding:10px 10px 40px}
.wrap{margin-top:14px}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,275px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cols3{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.cols3{grid-template-columns:repeat(3,1fr)}}
.hide{display:none !important}
.muted{opacity:.75;font-size:.92em}
.small{font-size:.86em}
.center{text-align:center}
/* ============================================================
   ПАНЕЛИ / ЗАГОЛОВКИ
   ============================================================ */
.panel{
  position:relative;background:var(--paper);
  border:3px solid var(--ink);border-radius:8px;
  box-shadow:var(--shadow);padding:16px;margin-bottom:16px;
}
.panel.dots{background-image:var(--dots);background-size:7px 7px}
.panel.red{background:#ffd9d3}
.panel.blue{background:#d9e4ff}
.panel.yellow{background:#fff0b8}
.panel.green{background:#d9f6e0}
.panel.dark{background:var(--ink);color:var(--paper)}
.panel.dark .title{text-shadow:3px 3px 0 var(--red)}
.panel.tightpad{padding:12px}
.title{font-size:clamp(1.3rem,4.4vw,2.1rem);transform:skewX(-5deg)}
.title.big{font-size:clamp(1.7rem,7vw,3.1rem)}
.sub{font-family:var(--font-b);font-weight:700;text-transform:none;letter-spacing:0;font-size:clamp(.95rem,2.6vw,1.1rem)}
.tagline{
  display:inline-block;font-family:var(--font-d);text-transform:uppercase;
  background:var(--yellow);border:3px solid var(--ink);box-shadow:var(--shadow-sm);
  padding:5px 12px;transform:rotate(-2deg);font-size:clamp(.8rem,2.6vw,1rem)
}
.tagline.blue{background:var(--cyan)}
.tagline.pink{background:var(--pink);color:#fff}
/* Шапка */
header.masthead{
  background:var(--red);border:4px solid var(--ink);border-radius:10px;
  box-shadow:var(--shadow);padding:12px 12px 10px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 10px,transparent 10px 20px);
}
.mast-in{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.logo{color:var(--yellow);text-shadow:3px 3px 0 var(--ink);font-size:clamp(1.05rem,4.6vw,1.7rem);transform:skewX(-6deg);letter-spacing:.5px}
.logo small{display:block;font-family:var(--font-b);font-weight:700;text-transform:uppercase;color:#fff;font-size:.62em;letter-spacing:1.6px;text-shadow:2px 2px 0 var(--ink)}
/* Степпер */
ol.steps{list-style:none;display:flex;gap:6px;padding:0;margin:12px 0 0;overflow-x:auto;scrollbar-width:thin}
ol.steps li{flex:1 1 0;min-width:74px}
.step{
  width:100%;min-height:46px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;
  background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);
  cursor:pointer;padding:4px 3px;text-align:center;font-size:.68rem;line-height:1.05;text-transform:uppercase;
}
.step b{font-size:.82rem}
.step[aria-current="step"]{background:var(--yellow);transform:translate(-1px,-1px)}
.step.locked{opacity:.45;cursor:not-allowed}
.step:disabled{cursor:not-allowed}
/* ============================================================
   КНОПКИ
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:10px 16px;cursor:pointer;
  font-size:clamp(.86rem,2.7vw,1rem);text-transform:uppercase;letter-spacing:.6px;
  background:var(--yellow);color:var(--ink);
  border:3px solid var(--ink);border-radius:8px;box-shadow:var(--shadow-sm);
  transition:transform .07s ease,box-shadow .07s ease,background .15s;
}
.btn:hover{background:#ffd84d}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:#f5333b}
.btn.blue{background:var(--blue);color:#fff}
.btn.blue:hover{background:#2f66ec}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:var(--paper)}
.btn.ink{background:var(--ink);color:var(--yellow)}
.btn.sm{min-height:44px;padding:8px 12px;font-size:.8rem}
.btn[aria-pressed="true"]{background:var(--green);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.btn.wide{width:100%}
/* Бейдж-взрыв */
.burst{display:grid;place-items:center;width:72px;height:72px;background:var(--ink);clip-path:var(--star);padding:5px;flex:none}
.burst-in{display:grid;place-items:center;width:100%;height:100%;background:var(--yellow);clip-path:var(--star);font-family:var(--font-d);font-size:.95rem;text-align:center;line-height:1;color:var(--ink);padding:4px}
.burst-in.red{background:var(--red);color:#fff}
.burst-in.blue{background:var(--cyan);color:var(--ink)}
.burst.sm{width:52px;height:52px;padding:4px}
.burst.sm .burst-in{font-size:.8rem}
.rank{display:grid;place-items:center;width:46px;height:46px;background:var(--ink);clip-path:var(--star);padding:4px;flex:none}
.rank-in{display:grid;place-items:center;width:100%;height:100%;background:var(--pink);clip-path:var(--star);color:#fff;font-family:var(--font-d);font-size:1.1rem}
/* Речевой пузырь */
.bubble{
  position:relative;background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:14px 14px 12px;box-shadow:var(--shadow-sm);margin:6px 0 18px;
}
.bubble:after{
  content:"";position:absolute;left:26px;bottom:-19px;width:22px;height:22px;background:#fff;
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);
  transform:rotate(40deg) skewX(14deg);
}
.bubble.right:after{left:auto;right:26px}
/* ============================================================
   КАРТОЧКИ КАТАЛОГА
   ============================================================ */
.card{
  position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:10px;
  box-shadow:var(--shadow-sm);padding:12px;display:flex;flex-direction:column;gap:8px;
  transition:transform .1s ease,box-shadow .1s ease;
}
.card:hover{transform:translate(-1px,-2px);box-shadow:6px 8px 0 var(--ink)}
.card.picked{background:#e6ffe9;box-shadow:4px 4px 0 var(--green)}
.card.ranked{background:#fff0f7;box-shadow:4px 4px 0 var(--pink)}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-sym{
  flex:none;width:46px;height:46px;display:grid;place-items:center;font-size:1.5rem;
  background:var(--blue);color:#fff;border:3px solid var(--ink);border-radius:8px;
}
.card h3{font-size:clamp(1rem,3.2vw,1.2rem)}
.kicker{font-family:var(--font-d);text-transform:uppercase;font-size:.66rem;letter-spacing:1.4px;color:var(--red-d)}
.verdict{
  display:inline-block;font-family:var(--font-d);text-transform:uppercase;font-size:.66rem;
  border:2px solid var(--ink);border-radius:5px;padding:2px 7px;letter-spacing:.6px
}
.v-great{background:var(--green);color:#fff}
.v-good{background:var(--cyan)}
.v-mid{background:var(--yellow)}
.v-low{background:var(--red);color:#fff}
.meter{height:18px;border:3px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden;flex:1;min-width:110px}
.meter i{display:block;height:100%;border-right:3px solid var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700}
.stat b{text-transform:uppercase;font-size:.68rem;letter-spacing:.5px;opacity:.8}
.sqs{display:inline-flex;gap:2px}
.sq{width:9px;height:14px;background:#fff;border:2px solid var(--ink);display:block;border-radius:2px}
.sq.on{background:var(--red)}
.sq.on.b{background:var(--blue)}
.sq.on.g{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:.74rem;font-weight:700;text-transform:lowercase;
  border:2px solid var(--ink);border-radius:20px;padding:3px 9px;background:#fff;
  min-height:26px;display:inline-flex;align-items:center
}
.chip.mood{background:var(--paper2)}
.chip.pick{background:var(--pink);color:#fff}
.details{border-top:3px dashed var(--ink);padding-top:8px;margin-top:2px}
.details h4{font-size:.82rem;margin:.5em 0 .2em;color:var(--blue-d)}
.reasons{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.reasons li{
  font-size:.84rem;border-left:5px solid var(--green);background:#fff;padding:5px 8px;border-radius:0 5px 5px 0;
  border-top:2px solid var(--ink);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)
}
.reasons li.warn{border-left-color:var(--red);background:#fff1ee}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
/* ============================================================
   ТАБЫ / ФИЛЬТРЫ / ФОРМЫ
   ============================================================ */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{
  flex:1 1 150px;min-height:52px;padding:8px 10px;cursor:pointer;text-align:left;
  background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:var(--shadow-sm);
  font-size:.9rem;text-transform:uppercase;color:var(--ink)
}
.tab span{display:block;font-family:var(--font-b);font-weight:700;text-transform:none;font-size:.74rem;opacity:.75}
.tab[aria-selected="true"]{background:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.filters{display:grid;gap:10px;grid-template-columns:1fr;margin-bottom:12px}
@media(min-width:760px){.filters{grid-template-columns:minmax(180px,1.4fr) minmax(150px,1fr) auto}}
label.fld{display:block;font-family:var(--font-d);text-transform:uppercase;font-size:.74rem;letter-spacing:.8px;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{
  width:100%;min-height:46px;padding:10px 12px;font-family:var(--font-b);font-size:1rem;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:8px
}
textarea{min-height:120px;resize:vertical}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--red);background:#fff2f0}
.form-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.form-grid{grid-template-columns:1fr 1fr}}
fieldset{border:3px solid var(--ink);border-radius:8px;padding:10px 12px;background:#fff;margin:0}
legend{font-family:var(--font-d);text-transform:uppercase;font-size:.78rem;padding:0 6px;letter-spacing:.6px}
.opt{
  display:flex;gap:9px;align-items:center;min-height:46px;padding:6px 10px;margin:4px 0;
  border:2px solid var(--ink);border-radius:8px;background:var(--paper);cursor:pointer;font-weight:700
}
.opt input{width:22px;height:22px;accent-color:var(--red);flex:none}
.opt:has(input:checked){background:#d9f6e0}
.opt.small{min-height:44px;font-weight:400;font-size:.9rem}
.err{color:var(--red-d);font-weight:700;font-size:.85rem;margin:4px 0 0}
.err:before{content:"! ";font-family:var(--font-d)}
.hint{font-size:.8rem;opacity:.75;margin:3px 0 0}
input[type=range]{width:100%;accent-color:var(--red);height:32px}
/* Уведомления */
.notice{
  border:3px solid var(--ink);border-radius:8px;box-shadow:var(--shadow-sm);
  padding:10px 12px;margin-bottom:14px;font-weight:700;background:var(--yellow)
}
.notice.ok{background:#d9f6e0}
.notice.warn{background:#ffd9d3}
.notice.info{background:#d9e4ff}
/* Шорт-лист / топ */
.slot{
  display:flex;gap:10px;align-items:center;border:3px dashed var(--ink);border-radius:10px;
  padding:10px;background:#fff;min-height:56px
}
.slot.filled{border-style:solid;background:var(--paper2)}
.picklist{display:grid;gap:10px}
.plan{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:12px;font-size:.94rem}
.plan b{font-family:var(--font-d);text-transform:uppercase;font-size:.8rem;letter-spacing:.6px}
ol.weeks{padding-left:1.3em}
ol.weeks li{margin:.45em 0}
footer.foot{
  margin-top:18px;border-top:4px solid var(--ink);padding-top:12px;
  display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center
}
.counter{font-family:var(--font-d);font-size:.9rem;text-transform:uppercase}
.counter b{background:var(--ink);color:var(--yellow);padding:2px 8px;border-radius:5px}
.progressline{height:22px;border:3px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}
.progressline i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--red) 0 10px,var(--red-d) 10px 20px)}
@media(max-width:420px){
  .burst{width:60px;height:60px}
  .panel{padding:12px;box-shadow:var(--shadow-sm)}
  .card-actions .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>

/* --- ЖАНРЫ (10) --- */

/* Создание элемента без innerHTML: весь пользовательский ввод — через textContent */
function h(tag, props, ...kids){
  const node = document.createElement(tag);
  if(props){
    for(const key in props){
      const v = props[key];
      if(v === null || v === undefined || v === false) continue;
      if(key === 'class') node.className = v;
      else if(key === 'text') node.textContent = v;
      else if(key === 'dataset') Object.assign(node.dataset, v);
      else if(key === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if(key.slice(0,2) === 'on' && typeof v === 'function') node.addEventListener(key.slice(2).toLowerCase(), v);
      else if(v === true) node.setAttribute(key, '');
      else node.setAttribute(key, String(v));
    }
  }
  kids.flat(Infinity).forEach(ch => {
    if(ch === null || ch === undefined || ch === false || ch === '') return;
    node.appendChild(typeof ch === 'object' ? ch : document.createTextNode(String(ch)));
  });
  return node;
}
const $ = sel => document.querySelector(sel);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

function save(){

      quiz:state.quiz, picked:state.picked, top:state.top, open:state.open, result:state.result, exported:state.exported
    };
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(e){ /* приватный режим — просто работаем без сохранения */ }
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || typeof data !== 'object') return null;
    const s = defaultState();
    ['screen','unlocked','profileDone','exported'].forEach(k => { if(typeof data[k] !== 'undefined') s[k] = data[k]; });
    if(data.profile) s.profile = Object.assign(s.profile, data.profile);
    if(data.quiz) s.quiz = Object.assign(s.quiz, data.quiz);
    if(data.picked) CAT_ORDER.forEach(c => { if(Array.isArray(data.picked[c])) s.picked[c] = data.picked[c].filter(id => itemById(c,id)); });
    if(data.top) CAT_ORDER.forEach(c => { if(Array.isArray(data.top[c])) s.top[c] = data.top[c].filter(id => itemById(c,id)); });
    if(data.open && typeof data.open === 'object') s.open = data.open;
    if(data.result) s.result = data.result;
    return s;
  }catch(e){ return null; }
}

   ============================================================ */
function caps(){
  const p = state.profile;
  const bud = (BUDGETS.find(b => b.id === p.budget) || BUDGETS[1]).cap;
  const prepCap = clamp(Math.round(Number(p.weeks || 4) / 2), 1, 5);
  const actCap = clamp(Number(p.acting) || 3, 1, 5);
  return {bud, prepCap, actCap};
}
/* Считает, насколько элемент подходит конкретному классу: 0..100 + причины */
function compatScore(item, useProfile){
  const p = useProfile || state.profile;
  const hasProfile = !!p.className || state.profileDone;
  const {bud, prepCap, actCap} = hasProfile ? caps() : {bud:3.5, prepCap:2, actCap:3};
  const moods = hasProfile ? (p.moods || []) : [];
  const flags = hasProfile ? (p.flags || []) : [];
  let score = 55;
  const reasons = [];
  const st = item.stats;

  /* время на подготовку */
  const dPrep = prepCap - st.prep;
  if(dPrep >= 0){ score += Math.min(dPrep,2) * 5; reasons.push({ok:true, t:`Времени хватает: нужно ${st.prep}/5, у вас ${prepCap}/5`}); }
  else { score += dPrep * 9; reasons.push({ok:false, t:`Подготовка тяжёлая: нужно ${st.prep}/5, у вас ${prepCap}/5`}); }

  /* бюджет и реквизит */
  const dBud = bud - st.budget;
  if(dBud >= 0){ score += Math.min(dBud,2) * 4; reasons.push({ok:true, t:`Реквизит по карману: нужно ${st.budget}/5, бюджет ${bud}/5`}); }
  else { score += dBud * 10; reasons.push({ok:false, t:`Реквизит дороже бюджета: нужно ${st.budget}/5, есть ${bud}/5`}); }

  /* актёрский уровень */
  const dAct = actCap - st.acting;
  if(dAct >= 0){ score += Math.min(dAct,2) * 4; reasons.push({ok:true, t:`Актёрская нагрузка по силам: нужно ${st.acting}/5, уровень ${actCap}/5`}); }
  else { score += dAct * 9; reasons.push({ok:false, t:`Нужна сильная игра: ${st.acting}/5, а уровень класса ${actCap}/5`}); }

  /* настроение */
  if(moods.length){
    const hit = item.moods.filter(m => moods.includes(m));
    if(hit.length){ score += hit.length * 9; reasons.push({ok:true, t:'Попадает в настроение класса: ' + hit.join(', ')}); }
    else { score -= 12; reasons.push({ok:false, t:'Не совпадает с выбранным настроением (' + item.moods.join(', ') + ')'}); }
  }

  /* спец-ресурсы */
  (item.boost || []).forEach(f => {
    const lab = (FLAGS.find(x => x.id === f) || {}).label || f;
    if(flags.includes(f)){ score += 6; reasons.push({ok:true, t:'Есть ресурс: ' + lab}); }
  });
  if((item.boost || []).length && !(item.boost || []).some(f => flags.includes(f)) && flags.length){
    score -= 5; reasons.push({ok:false, t:'Не использует ваши ресурсы (музыка / танцы / видео / свет)'});
  }

  /* масштаб класса */
  const n = Number(p.students) || 20;
  if(n >= 22 && st.prep <= 3){ score += 4; reasons.push({ok:true, t:`Большой класс (${n}) легко задействовать в простых ролях`}); }
  if(n <= 10 && st.props >= 4){ score -= 6; reasons.push({ok:false, t:`Мало людей (${n}) для объёмного реквизита`}); }

  return {score: clamp(Math.round(score), 0, 100), reasons};
}
function verdictOf(score){
  if(score >= 82) return {cls:'v-great', label:'ИДЕАЛЬНО'};
  if(score >= 66) return {cls:'v-good',  label:'ПОДХОДИТ'};
  if(score >= 48) return {cls:'v-mid',   label:'С РИСКОМ'};
  return {cls:'v-low', label:'СЛОЖНО'};
}
function verdictColor(score){
  if(score >= 82) return 'var(--green)';
  if(score >= 66) return 'var(--cyan)';
  if(score >= 48) return 'var(--yellow)';
  return 'var(--red)';
}
/* Средний балл совместимости выбранного топ-9 */
function avgTopCompat(){
  const vals = [];
  CAT_ORDER.forEach(c => state.top[c].forEach(id => {
    const it = itemById(c,id); if(it) vals.push(compatScore(it).score);
  }));
  if(!vals.length) return 0;
  return Math.round(vals.reduce((a,b) => a + b, 0) / vals.length);
}
function totalReadiness(){
  const quizPart = state.quiz.skipped ? 0 : Math.round((state.quiz.score / (QUIZ.length * QUIZ_POINT)) * 100);
  return {quiz:quizPart, compat:avgTopCompat(), total:Math.round(quizPart * 0.4 + avgTopCompat() * 0.6)};
}

  switch(state.screen){
    case 'start':   main.appendChild(screenStart());   break;
    case 'quiz':    main.appendChild(screenQuiz());    break;
    case 'profile': main.appendChild(screenProfile()); break;
    case 'catalog': main.appendChild(screenCatalog()); break;
    case 'match':   main.appendChild(screenMatch());   break;
    case 'final':   main.appendChild(screenFinal());   break;
    default:        main.appendChild(screenStart());

}

function renderHeader(){
  const steps = h('ol', {class:'steps'});
  STEPS.forEach((s, i) => {
    const li = h('li', {});
    const locked = i > state.unlocked;
    const btn = h('button', {
      class:'step' + (locked ? ' locked' : ''),
      type:'button',
      disabled: locked ? 'disabled' : null,
      'aria-current': s.id === state.screen ? 'step' : null,
      title: locked ? 'Шаг откроется позже' : 'Перейти: ' + s.label,
      onclick: locked ? null : () => goTo(s.id)
    },
      h('b', {text:String(i+1)}),
      h('span', {text:s.label})
    );
    li.appendChild(btn);
    steps.appendChild(li);
  });
  const scoreTxt = state.quiz.skipped ? '—' : (state.quiz.score + '/' + (QUIZ.length * QUIZ_POINT));
  return h('header', {class:'masthead'},
    h('div', {class:'mast-in'},
      h('div', {class:'logo'},
        'ПОСЛЕДНИЙ ЗВОНОК',
        h('small', {text:'Сценарная лаборатория: жанры • стили • концепции'})
      ),
      h('div', {class:'burst sm', 'aria-hidden':'true'},
        h('span', {class:'burst-in' + (state.quiz.done ? ' red' : '')}, 'БАЛЛЫ ' + scoreTxt))
    ),
    steps
  );
}

/* --- Экран 2: РАЗМИНКА (квиз с баллами) --- */
function screenQuiz(){
  const qz = state.quiz;
  const total = QUIZ.length * QUIZ_POINT;
  const box = h('section', {class:'panel', 'aria-labelledby':'quiz-h'});
  box.appendChild(h('div', {class:'spread'},
    h('h2', {class:'title', id:'quiz-h', text:'Разминка: язык сценариста'}),
    h('span', {class:'counter'}, 'Баллы: ', h('b', {text:qz.score + ' / ' + total}))
  ));
  box.appendChild(h('div', {class:'progressline', 'aria-hidden':'true'},
    h('i', {style:{width: (qz.done ? 100 : (qz.idx / QUIZ.length) * 100) + '%'}})));
  box.appendChild(h('p', {class:'muted small', text:'Вопрос ' + Math.min(qz.idx + 1, QUIZ.length) + ' из ' + QUIZ.length + '. Верный ответ — ' + QUIZ_POINT + ' баллов. Ошибки не штрафуются.'}));

  if(qz.done){
    const pct = Math.round((qz.score / total) * 100);
    let verdict = 'Нужно ещё раз пролистать каталог — там есть подсказки.';
    let burstCls = 'burst-in red';
    if(pct >= 90){ verdict = 'Отличный уровень! Вы говорите на языке сценариста.'; burstCls = 'burst-in'; }
    else if(pct >= 70){ verdict = 'Хорошо! Пара терминов — и вы готовы защищать идею.'; burstCls = 'burst-in blue'; }
    else if(pct >= 45){ verdict = 'Неплохо, но перечитайте карточки жанров и стилей.'; burstCls = 'burst-in'; }

    box.appendChild(h('div', {class:'row', style:{marginTop:'14px'}},
      h('div', {class:'burst'}, h('span', {class:burstCls}, pct + '%')),
      h('div', {style:{flex:'1 1 200px'}},
        h('h3', {class:'title', style:{fontSize:'1.2rem'}, text:'Результат разминки: ' + qz.score + ' из ' + total}),
        h('p', {class:'sub', text:verdict}))
    ));
    const det = h('ul', {class:'small'});
    QUIZ.forEach((q, i) => {
      const ans = qz.answers ? qz.answers[i] : undefined;
      det.appendChild(h('li', {},
        h('span', {text: (ans === q.a ? '✔ ' : '✘ ') + q.q + ' — '}),
        h('b', {text:q.opts[q.a]})
      ));
    });
    box.appendChild(det);
    box.appendChild(h('div', {class:'row', style:{marginTop:'10px'}},
      h('button', {class:'btn blue', type:'button', onclick:() => goTo('profile')}, text:'ДАЛЬШЕ: АНКЕТА КЛАССА'),
      h('button', {class:'btn ghost', type:'button', onclick:() => restartQuiz()}, text:'ПЕРЕСДАТЬ')
    ));
    return box;
  }

  const q = QUIZ[qz.idx];
  const qBox = h('div', {class:'bubble', style:{marginTop:'12px'}});
  qBox.appendChild(h('p', {class:'sub', text:q.q}));
  const group = h('div', {role:'group', 'aria-label':'Варианты ответа'});
  q.opts.forEach((opt, i) => {
    const btn = h('button', {
      class:'btn ghost wide', type:'button', style:{justifyContent:'flex-start', textAlign:'left'},
      onclick:() => answerQuiz(i)
    }, h('span', {text:String.fromCharCode(65 + i) + '.'}), h('span', {text:opt, style:{fontFamily:'var(--font-b)', textTransform:'none', letterSpacing:'0'}}));
    group.appendChild(btn);
  });
  qBox.appendChild(group);
  box.appendChild(qBox);

  if(qz.answered){
    const correct = qz.lastCorrect;
    const fb = h('div', {class:'panel tightpad ' + (correct ? 'green' : 'red'), role:'status', 'aria-live':'polite'});
    fb.appendChild(h('h3', {class:'title', style:{fontSize:'1.05rem'}, text: correct ? 'БАМ! Верно (+' + QUIZ_POINT + ')' : 'МИМО! Правильный ответ: ' + q.opts[q.a]}));
    fb.appendChild(h('p', {class:'small', text:q.why}));
    fb.appendChild(h('button', {
      class:'btn ' + (qz.idx + 1 >= QUIZ.length ? 'red' : 'blue'), type:'button',
      onclick:() => nextQuestion()
    }, text: qz.idx + 1 >= QUIZ.length ? 'ПОКАЗАТЬ ИТОГ' : 'СЛЕДУЮЩИЙ ВОПРОС'));
    box.appendChild(fb);
  }

  box.appendChild(h('div', {class:'row', style:{marginTop:'12px'}},
    h('button', {class:'btn ghost sm', type:'button', onclick:() => skipQuiz()}, text:'ПРОПУСТИТЬ РАЗМИНКУ')
  ));
  return box;
}

function tabKeys(e, i){
  const keys = ['ArrowRight','ArrowLeft','Home','End'];
  if(!keys.includes(e.key)) return;
  e.preventDefault();
  let n = i;
  if(e.key === 'ArrowRight') n = (i + 1) % CAT_ORDER.length;
  if(e.key === 'ArrowLeft') n = (i - 1 + CAT_ORDER.length) % CAT_ORDER.length;
  if(e.key === 'Home') n = 0;
  if(e.key === 'End') n = CAT_ORDER.length - 1;
  state.cat = CAT_ORDER[n]; save(); render();
  const t = document.getElementById('tab-' + state.cat); if(t) t.focus();
}

function filteredItems(cat){
  const f = state.filters;
  let list = CATS[cat].data.map(it => ({it, r:compatScore(it)}));
  const q = (f.q || '').trim().toLowerCase();
  if(q){
    list = list.filter(x => {
      const hay = (x.it.name + ' ' + x.it.short + ' ' + x.it.about + ' ' + x.it.hook + ' ' + x.it.moods.join(' ')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  if(f.onlyFit) list = list.filter(x => x.r.score >= 70);
  if(f.mood !== 'all') list = list.filter(x => x.it.moods.indexOf(f.mood) !== -1);
  if(f.onlyPicked) list = list.filter(x => state.picked[cat].indexOf(x.it.id) !== -1);
  if(f.sort === 'score') list.sort((a,b) => b.r.score - a.r.score);
  else if(f.sort === 'easy') list.sort((a,b) => (a.it.stats.prep + a.it.stats.budget) - (b.it.stats.prep + b.it.stats.budget));
  else list.sort((a,b) => a.it.name.localeCompare(b.it.name, 'ru'));
  return list;
}
/* Локальная перерисовка сетки (чтобы не терять фокус в поиске) */
function paintGrid(){
  const grid = document.getElementById('results-grid');
  const countEl = document.getElementById('results-count');
  const emptyEl = document.getElementById('results-empty');
  if(!grid) return;
  const cat = state.cat;
  const list = filteredItems(cat);
  grid.textContent = '';
  emptyEl.textContent = '';
  if(countEl) countEl.textContent = 'Найдено: ' + list.length + ' из ' + CATS[cat].data.length + ' — ' + CATS[cat].label.toLowerCase();
  if(!list.length){
    emptyEl.appendChild(h('div', {class:'panel red tightpad'},
      h('h3', {class:'title', style:{fontSize:'1rem'}, text:'Ничего не найдено'}),
      h('p', {class:'small', text:'Под эти фильтры не подошла ни одна карточка. Попробуйте изменить запрос или сбросить фильтры.'}),
      h('button', {class:'btn sm ghost', type:'button', onclick:() => { state.filters = {q:'',sort:'score',mood:'all',onlyFit:false,onlyPicked:false}; render(); }}, text:'СБРОСИТЬ ФИЛЬТРЫ')
    ));
    return;
  }
  list.forEach(x => grid.appendChild(card(x.it, x.r, cat)));
}

function statMeter(label, val, color){
  const sqs = [];
  for(let i = 1; i <= 5; i++) sqs.push(h('i', {class:'sq' + (i <= val ? ' on ' + (color || '') : '')}));
  return h('span', {class:'stat', title:label + ': ' + val + ' из 5'},
    h('b', {text:label}), h('span', {class:'sqs'}, sqs));
}

function card(item, res, cat){
  const picked = state.picked[cat].indexOf(item.id) !== -1;
  const rankIdx = state.top[cat].indexOf(item.id);
  const open = !!state.open[item.id];
  const v = verdictOf(res.score);

  const cardEl = h('article', {class:'card' + (picked ? ' picked' : '') + (rankIdx >= 0 ? ' ranked' : ''), 'aria-labelledby':'h-' + item.id});
  cardEl.appendChild(h('div', {class:'card-head'},
    h('span', {class:'card-sym', 'aria-hidden':'true', text:item.sym}),
    h('div', {style:{flex:'1 1 auto'}},

        h('button', {class:'btn sm green', type:'button', style:{marginTop:'6px'}, onclick:() => autoPick(c)}, text:'АВТО-ТОП-3')

/* --- Подвал: навигация между экранами --- */
function renderFooter(){
  const idx = STEPS.findIndex(s => s.id === state.screen);
  const can = canNext();
  const foot = h('footer', {class:'foot'});
  foot.appendChild(h('button', {
    class:'btn ghost', type:'button', disabled: idx <= 0 || state.screen === 'start' ? 'disabled' : null,
    onclick:() => { if(idx > 0) goTo(STEPS[idx - 1].id); }
  }, text:'← НАЗАД'));

  foot.appendChild(h('p', {class:'small muted', style:{flex:'1 1 200px', margin:0}, text:can.hint}));

  if(state.screen !== 'final'){
    foot.appendChild(h('button', {
      class:'btn ' + (can.ok ? 'red' : 'ghost'), type:'button',
      disabled: can.ok ? null : 'disabled',
      onclick:() => nextScreen()
    }, text:'ДАЛЬШЕ →'));
  } else {
    foot.appendChild(h('button', {class:'btn red', type:'button', onclick:() => buildResult()}, text:state.result ? 'ПОКАЗАТЬ ИТОГ' : 'СОБРАТЬ СЦЕНАРИЙ'}));
  }
  return foot;
}
function canNext(){
  const s = state.screen;
  if(s === 'start') return {ok:true, hint:'Начните с разминки — она займёт 3 минуты.'};
  if(s === 'quiz'){
    if(state.quiz.done) return {ok:true, hint:'Разминка пройдена: ' + state.quiz.score + ' баллов.'};
    return {ok:false, hint:'Ответьте на вопросы или пропустите разминку, чтобы идти дальше.'};
  }
  if(s === 'profile'){
    return state.profileDone
      ? {ok:true, hint:'Анкета заполнена — идём в каталог.'}
      : {ok:false, hint:'Заполните и сохраните анкету класса, иначе подбор будет неточным.'};
  }
  if(s === 'catalog'){
    const total = CAT_ORDER.reduce((a,c) => a + state.picked[c].length, 0);
    return {ok:true, hint:'В шорт-листе ' + total + ' карточек. Дальше — подбор по совместимости.'};
  }
  if(s === 'match'){
    const bad = CAT_ORDER.filter(c => state.picked[c].length < NEED_PER_CAT);
    if(bad.length) return {ok:false, hint:'Минимум ' + NEED_PER_CAT + ' в каждой категории. Не хватает: ' + bad.map(c => CATS[c].label.toLowerCase()).join(', ') + '.'};
    return {ok:true, hint:'Шорт-лист готов — расставьте топ-3.'};
  }
  return {ok:true, hint:''};
}
function nextScreen(){
  const idx = STEPS.findIndex(s => s.id === state.screen);
  if(idx < 0 || idx >= STEPS.length - 1) return;
  const c = canNext();
  if(!c.ok){ setNotice('warn', c.hint); return; }
  goTo(STEPS[idx + 1].id);
}
function goTo(screen){
  state.screen = screen;
  state.notice = null;
  const idx = STEPS.findIndex(s => s.id === screen);
  if(idx > state.unlocked) state.unlocked = idx;
  save(); render();
}

/* ============================================================
   6. HANDLERS
   ============================================================ */
function startFresh(){
  const keepProgress = state.unlocked;
  state = defaultState();
  state.unlocked = 1;
  state.screen = 'quiz';
  save(); render();
  setNotice('info','Поехали! Вопрос 1 из ' + QUIZ.length + '.');
}
function hardReset(){
  if(!window.confirm('Сбросить весь прогресс (анкету, шорт-лист, баллы)?')) return;
  clearStore();
  state = defaultState();
  render();
  setNotice('warn','Прогресс сброшен. Начинаем с чистого листа.');
}
function restartQuiz(){
  state.quiz = {idx:0, score:0, answered:false, done:false, skipped:false, lastCorrect:null, answers:{}};
  save(); render();
}
function skipQuiz(){
  state.quiz.skipped = true; state.quiz.done = true; state.quiz.score = 0;
  unlock(2); save(); render();
  setNotice('info','Разминка пропущена — баллы за теорию не начислены.');
}
function answerQuiz(i){
  const qz = state.quiz;
  if(qz.answered) return;
  if(!qz.answers) qz.answers = {};
  qz.answers[qz.idx] = i;
  const q = QUIZ[qz.idx];
  qz.lastCorrect = (i === q.a);
  if(qz.lastCorrect) qz.score += QUIZ_POINT;
  qz.answered = true;
  save(); render();
}
function nextQuestion(){
  const qz = state.quiz;
  if(qz.idx + 1 >= QUIZ.length){
    qz.done = true; qz.answered = false; unlock(2);
    save(); render();
    setNotice('ok','Разминка завершена: ' + qz.score + ' из ' + (QUIZ.length * QUIZ_POINT) + ' баллов.');
    return;
  }
  qz.idx += 1; qz.answered = false; qz.lastCorrect = null;
  save(); render();
}
function unlock(i){ if(i > state.unlocked) state.unlocked = i; }

/* Валидация и сохранение анкеты */
function submitProfile(e){
  e.preventDefault();
  const form = e.target;
  const get = n => form.elements[n];
  const vals = {
    className: (get('className').value || '').trim(),
    students: get('students').value,
    weeks: get('weeks').value,
    acting: Number(get('acting').value),
    budget: (form.querySelector('input[name="budget"]:checked') || {}).value,
    moods: Array.prototype.slice.call(form.querySelectorAll('input[name="mood"]:checked')).map(i => i.value),
    flags: Array.prototype.slice.call(form.querySelectorAll('input[name="flag"]:checked')).map(i => i.value)
  };
  /* Сброс старых ошибок */
  ['className','students','weeks','acting','budget','moods'].forEach(k => {
    const errEl = document.getElementById(k + '-err'); if(errEl){ errEl.textContent = ''; errEl.classList.add('hide'); }
    const inp = form.elements[k]; if(inp && inp.setAttribute) inp.setAttribute('aria-invalid','false');
  });

  const errs = {};
  if(!vals.className) errs.className = 'Укажите название класса (например, 11 «А»).';
  else if(vals.className.length > 40) errs.className = 'Слишком длинное название: максимум 40 символов.';
  const students = Number(vals.students);
  if(!vals.students || !Number.isInteger(students) || students < 5 || students > 60) errs.students = 'Число участников: целое число от 5 до 60.';
  const weeks = Number(vals.weeks);
  if(!vals.weeks || !Number.isInteger(weeks) || weeks < 1 || weeks > 16) errs.weeks = 'Срок подготовки: целое число от 1 до 16 недель.';
  if(['low','mid','high'].indexOf(vals.budget) === -1) errs.budget = 'Выберите один уровень бюджета.';
  if(!(vals.acting >= 1 && vals.acting <= 5)) errs.acting = 'Оцените актёрский уровень от 1 до 5.';
  if(!vals.moods.length) errs.moods = 'Отметьте хотя бы одно настроение вечера.';
  else if(vals.moods.length > 4) errs.moods = 'Максимум 4 настроения — иначе сценарий «расползётся».';

  const keys = Object.keys(errs);
  if(keys.length){
    keys.forEach(k => {
      const el = document.getElementById(k + '-err');
      if(el){ el.textContent = errs[k]; el.classList.remove('hide'); }
      const inp = form.elements[k];
      if(inp && inp.setAttribute) inp.setAttribute('aria-invalid','true');
    });
    const first = form.elements[keys[0]] || document.getElementById(keys[0] + '-err');
    if(first && first.focus) first.focus();
    setNotice('warn','Проверьте анкету: ' + keys.length + ' пол(я/ей) заполнено с ошибками.');
    return;
  }

  state.profile = {
    className: vals.className, students, weeks, acting: vals.acting,
    budget: vals.budget, moods: vals.moods, flags: vals.flags
  };
  state.profileDone = true;
  /* Смена анкеты меняет совместимость — сбрасываем готовый результат */
  state.result = null;
  unlock(3);
  save();
  goTo('catalog');
  setNotice('ok','Анкета сохранена. Совместимость в каталоге пересчитана под ваш класс.');
}
function resetProfileForm(){
  state.profile = defaultState().profile;
  state.profileDone = false;
  save(); render();
  setNotice('warn','Анкета очищена — заполните её заново.');
}

/* Шорт-лист */
function togglePick(cat, id, rerender){
  const arr = state.picked[cat];
  const i = arr.indexOf(id);
  if(i >= 0){
    arr.splice(i, 1);
    const ti = state.top[cat].indexOf(id);
    if(ti >= 0) state.top[cat].splice(ti, 1);
  } else {
    arr.push(id);
  }
  state.result = null;
  save();
  if(rerender || state.screen !== 'catalog') render(); else paintGrid();
}
function autoPick(cat){
  const ranked = CATS[cat].data.map(it => ({it, s:compatScore(it).score})).sort((a,b) => b.s - a.s);
  state.picked[cat] = ranked.slice(0, NEED_PER_CAT).map(x => x.it.id);
  state.top[cat] = state.top[cat].filter(id => state.picked[cat].indexOf(id) !== -1);
  state.result = null;
  save(); render();
  setNotice('ok','Автоподбор: в шорт-листе «' + CATS[cat].label + '» теперь ' + ranked.slice(0, NEED_PER_CAT).map(x => x.it.name).join(', ') + '.');
}
function clearPick(cat){
  state.picked[cat] = []; state.top[cat] = []; state.result = null; save(); render();
  setNotice('warn','Шорт-лист «' + CATS[cat].label + '» очищен.');
}
/* Топ-3: последовательное ранжирование */
function toggleTop(cat, id){
  const arr = state.top[cat];
  const i = arr.indexOf(id);
  if(i >= 0){ arr.splice(i, 1); state.result = null; save(); render(); return; }
  if(arr.length >= 3){
    setNotice('warn','В топе уже 3 позиции. Уберите одну (кнопка ✕), чтобы поставить другую.');
    return;
  }
  arr.push(id);
  state.result = null;
  save(); render();
  if(arr.length === 3) setNotice('ok','Топ-3 «' + CATS[cat].label + '» заполнен!');
}
function resetTops(){
  CAT_ORDER.forEach(c => state.top[c] = []);
  state.result = null; save(); render();
  setNotice('warn','Топ-3 очищен во всех категориях.');
}

/* Сборка финального результата */
function buildResult(){
  const bad = CAT_ORDER.filter(c => state.top[c].length < 3);
  if(bad.length){
    setNotice('warn','Не хватает позиций в топ-3: ' + bad.map(c => CATS[c].label.toLowerCase() + ' (' + state.top[c].length + '/3)').join(', ') + '.');
    return;
  }
  const pick = (c, i) => itemById(c, state.top[c][i]);
  const G = [0,1,2].map(i => pick('genre', i));
  const S = [0,1,2].map(i => pick('style', i));
  const C = [0,1,2].map(i => pick('concept', i));
  const p = state.profile;
  const W = Number(p.weeks) || 4;
  const w = f => Math.max(1, Math.round(W * f));

  const logline = '«' + C[0].name + '»: ' + G[0].name.toLowerCase() + ' в стилистике «' + S[0].name + '» для ' + (p.className || 'класса') + '. ' + C[0].hook;

  const layers = {
    genre:[
      {name:G[0].name, role:'Основная линия: ' + G[0].short},
      {name:G[1].name, role:'Вторая линия (подсюжет): ' + G[1].short},
      {name:G[2].name, role:'Отдельные сцены / финальный аккорд: ' + G[2].short}
    ],
    style:[
      {name:S[0].name, role:'Главная картинка и звук: ' + S[0].short},
      {name:S[1].name, role:'Костюмы, свет, оформление: ' + S[1].short},
      {name:S[2].name, role:'Видеовставки и переходы: ' + S[2].short}
    ],
    concept:[
      {name:C[0].name, role:'Основной мир вечера: ' + C[0].short},
      {name:C[1].name, role:'Отдельная сцена-событие: ' + C[1].short},
      {name:C[2].name, role:'Фон, реквизит, фотозона: ' + C[2].short}
    ]
  };

  const plan = [
    'Неделя 1–' + w(0.2) + ': утвердить логлайн («' + C[0].name + ' + ' + G[0].name + ' + ' + S[0].name + '»), распределить ' + p.students + ' участников по ролям и рабочим группам (сценарий, реквизит, звук, видео).',
    'Неделя ' + (w(0.2) + 1) + '–' + w(0.45) + ': написать текст — сквозной сюжет «' + C[0].name + '», главные сцены в жанре «' + G[0].name + ', ' + G[1].name + '».',
    'Неделя ' + (w(0.45) + 1) + '–' + w(0.7) + ': костюмы и реквизит в стиле «' + S[0].name + '» (сложность реквизита ' + Math.max(C[0].stats.props, S[0].stats.props) + '/5), подготовка музыки и видеовставок «' + S[2].name + '».',
    'Неделя ' + (w(0.7) + 1) + '–' + Math.max(w(0.7) + 1, W - 1) + ': прогоны на площадке, тайминг (цель — не более 25–30 минут), свет и звук.',
    'Финальная неделя: генеральная репетиция и проверка главной эмоции — ' + moodText(p.moods) + '.'
  ];

  const risks = [];
  G.concat(S, C).forEach(x => { if(risks.length < 4 && risks.indexOf(x.name + ': ' + x.risk) === -1) risks.push(x.name + ': ' + x.risk); });

  const emotion = 'зал должен выйти с чувством: ' + (p.moods.join(' + ') || 'праздник и благодарность') + '. Ключевая сцена — «' + C[0].hook + '»';

  const sc = totalReadiness();
  const text = buildText({logline, layers, plan, risks, emotion, sc});

  state.result = {logline, layers, genre:layers.genre, style:layers.style, concept:layers.concept, plan, risks, emotion, score:sc, text};
  state.exported = true;
  save(); render();
  setNotice('ok','Сценарий собран! Сценарная готовность — ' + sc.total + '%.');
}
function moodText(moods){
  if(!moods || !moods.length) return 'праздник и благодарность';
  return moods.join(', ');
}
function buildText(d){
  const p = state.profile;
  const L = [];
  L.push('СЦЕНАРИЙ ПОСЛЕДНЕГО ЗВОНКА — ' + (p.className || 'класс').toUpperCase());
  L.push('='.repeat(52));
  L.push('');
  L.push('РЕСУРСЫ КЛАССА');
  L.push('Участников: ' + p.students + '; недель на подготовку: ' + p.weeks + ';');
  L.push('бюджет: ' + ((BUDGETS.find(b => b.id === p.budget) || {}).label || '—') + ';');
  L.push('актёрский уровень: ' + p.acting + '/5; настроение: ' + (p.moods.join(', ') || '—') + ';');
  L.push('ресурсы: ' + ((p.flags.map(f => (FLAGS.find(x => x.id === f) || {}).label).join('; ')) || 'не указаны') + '.');
  L.push('');
  L.push('ЛОГЛАЙН');
  L.push(d.logline);
  L.push('');
  L.push('ТОП-3 ЖАНРЫ');
  d.genre.forEach((x, i) => L.push('  ' + (i + 1) + '. ' + x.name + ' — ' + x.role));
  L.push('');
  L.push('ТОП-3 СТИЛИ');
  d.style.forEach((x, i) => L.push('  ' + (i + 1) + '. ' + x.name + ' — ' + x.role));
  L.push('');
  L.push('ТОП-3 КОНЦЕПЦИИ');
  d.concept.forEach((x, i) => L.push('  ' + (i + 1) + '. ' + x.name + ' — ' + x.role));
  L.push('');
  L.push('ПЛАН ПОДГОТОВКИ');
  d.plan.forEach((s, i) => L.push('  ' + (i + 1) + ') ' + s));
  L.push('');
  L.push('СМЕТА РИСКОВ');
  d.risks.forEach(s => L.push('  - ' + s));
  L.push('');
  L.push('ФИНАЛЬНАЯ ЭМОЦИЯ');
  L.push('  ' + d.emotion);
  L.push('');
  L.push('ИТОГОВЫЙ РЕЗУЛЬТАТ');
  L.push('  Разминка (теория): ' + d.sc.quiz + '%  (' + state.quiz.score + ' из ' + (QUIZ.length * QUIZ_POINT) + ' баллов)');
  L.push('  Совместимость топ-9: ' + d.sc.compat + '%');
  L.push('  Сценарная готовность: ' + d.sc.total + '%');
  L.push('');
  L.push('Собрано в «Сценарной лаборатории Последнего звонка».');
  return L.join('\n');
}
function copyPlan(text){
  const done = () => setNotice('ok','План скопирован в буфер обмена.');
  const fail = () => setNotice('warn','Браузер не дал доступ к буферу. Выделите текст в поле и скопируйте вручную (Ctrl/Cmd+C).');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(() => legacyCopy() ? done() : fail());
    } else {
      legacyCopy() ? done() : fail();
    }
  }catch(e){ fail(); }
}
function legacyCopy(){
  try{
    const ta = document.getElementById('planText');
    if(!ta) return false;
    ta.focus(); ta.select();
    return document.execCommand('copy');
  }catch(e){ return false; }
}
function downloadPlan(text){
  try{
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'scenariy-posledniy-zvonok.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    setNotice('ok','Файл сохранён — покажите его классному руководителю.');
  }catch(e){
    setNotice('warn','Скачивание недоступно в этом браузере. Используйте «Скопировать».');
  }
}

/* ============================================================
   7. INIT
   ============================================================ */
function init(){
  const restored = load();
  if(restored){
    state = restored;
    /* защита от «прыжка» на недоступный экран */
    const idx = STEPS.findIndex(s => s.id === state.screen);
    if(idx < 0 || idx > state.unlocked) state.screen = STEPS[Math.min(state.unlocked, STEPS.length - 1)].id;
    if(!state.quiz.answers) state.quiz.answers = {};
  } else {
    state = defaultState();
  }
  render();
}
init();
</script>
