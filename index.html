<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Час Общения: Выбор Сценария</title>
<style>
:root {
  --marvel-red: #e62429;
  --marvel-yellow: #ffc20e;
  --marvel-blue: #0033a0;
  --marvel-black: #000000;
  --marvel-white: #ffffff;
  --shadow-comic: 4px 4px 0px var(--marvel-black);
  --border-comic: 3px solid var(--marvel-black);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
  background: var(--marvel-yellow);
  background-image: 
    radial-gradient(circle, var(--marvel-black) 1px, transparent 1px);
  background-size: 20px 20px;
  min-height: 100vh;
  color: var(--marvel-black);
  line-height: 1.4;
}

#app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

/* Comic Book Style */
.comic-panel {
  background: var(--marvel-white);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  padding: 20px;
  margin-bottom: 20px;
  position: relative;
}

.comic-title {
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: var(--marvel-red);
  text-shadow: 
    3px 3px 0 var(--marvel-yellow),
    6px 6px 0 var(--marvel-black);
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
  transform: skewY(-2deg);
}

.comic-subtitle {
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  color: var(--marvel-blue);
  text-align: center;
  margin-bottom: 30px;
  text-transform: uppercase;
}

/* Speech Bubble */
.speech-bubble {
  background: var(--marvel-white);
  border: var(--border-comic);
  border-radius: 20px;
  padding: 15px 20px;
  position: relative;
  margin: 20px 0;
  box-shadow: var(--shadow-comic);
}

.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -20px;
  left: 30px;
  width: 0;
  height: 0;
  border: 10px solid transparent;
  border-top-color: var(--marvel-black);
}

.speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -16px;
  left: 32px;
  width: 0;
  height: 0;
  border: 8px solid transparent;
  border-top-color: var(--marvel-white);
  z-index: 1;
}

/* Buttons */
.btn-comic {
  background: var(--marvel-red);
  color: var(--marvel-white);
  border: var(--border-comic);
  padding: 15px 30px;
  font-size: 1.2rem;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: var(--shadow-comic);
  transition: all 0.1s;
  min-height: 44px;
  min-width: 44px;
  letter-spacing: 1px;
}

.btn-comic:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px var(--marvel-black);
}

.btn-comic:active {
  transform: translate(4px, 4px);
  box-shadow: none;
}

.btn-comic:focus-visible {
  outline: 3px dashed var(--marvel-yellow);
  outline-offset: 3px;
}

.btn-comic.btn-blue {
  background: var(--marvel-blue);
}

.btn-comic.btn-yellow {
  background: var(--marvel-yellow);
  color: var(--marvel-black);
}

/* Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  margin: 20px 0;
}

.card {
  background: var(--marvel-white);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    radial-gradient(circle, var(--marvel-red) 1px, transparent 1px);
  background-size: 15px 15px;
  opacity: 0.1;
  pointer-events: none;
}

.card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px var(--marvel-black);
}

.card.selected {
  background: var(--marvel-yellow);
  border-color: var(--marvel-red);
  border-width: 5px;
}

.card-title {
  font-size: 1.5rem;
  color: var(--marvel-red);
  margin-bottom: 10px;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

.card-description {
  font-size: 1rem;
  color: var(--marvel-black);
  line-height: 1.5;
  position: relative;
  z-index: 1;
  font-family: Arial, sans-serif;
  font-weight: normal;
}

.card-checkbox {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  background: var(--marvel-white);
  border: var(--border-comic);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  z-index: 2;
}

.card.selected .card-checkbox {
  background: var(--marvel-red);
  color: var(--marvel-white);
}

/* Section Header */
.section-header {
  background: var(--marvel-blue);
  color: var(--marvel-yellow);
  padding: 15px 20px;
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  margin-bottom: 20px;
  font-size: 1.8rem;
  text-transform: uppercase;
  text-align: center;
  letter-spacing: 2px;
}

/* Counter */
.counter {
  background: var(--marvel-red);
  color: var(--marvel-white);
  padding: 10px 20px;
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  display: inline-block;
  font-size: 1.2rem;
  margin: 10px 0;
  text-transform: uppercase;
}

/* Navigation */
.nav-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 30px 0;
}

/* Final Results */
.results-section {
  background: var(--marvel-white);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  padding: 20px;
  margin-bottom: 20px;
}

.results-title {
  font-size: 1.8rem;
  color: var(--marvel-blue);
  margin-bottom: 15px;
  text-transform: uppercase;
  text-align: center;
}

.results-list {
  list-style: none;
  padding: 0;
}

.results-item {
  background: var(--marvel-yellow);
  border: var(--border-comic);
  padding: 15px;
  margin-bottom: 10px;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  gap: 10px;
}

.results-item-number {
  background: var(--marvel-red);
  color: var(--marvel-white);
  width: 40px;
  height: 40px;
  border: var(--border-comic);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: bold;
  flex-shrink: 0;
}

/* Start Screen */
.start-screen {
  text-align: center;
  padding: 40px 20px;
}

.start-logo {
  font-size: clamp(3rem, 8vw, 5rem);
  color: var(--marvel-red);
  text-shadow: 
    4px 4px 0 var(--marvel-yellow),
    8px 8px 0 var(--marvel-black);
  margin-bottom: 30px;
  letter-spacing: 3px;
  transform: skewY(-3deg);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: skewY(-3deg) scale(1); }
  50% { transform: skewY(-3deg) scale(1.05); }
}

.start-description {
  font-size: 1.2rem;
  max-width: 600px;
  margin: 0 auto 30px;
  line-height: 1.6;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--marvel-blue);
  font-size: 1.2rem;
}

/* Responsive */
@media (max-width: 600px) {
  .cards-grid {
    grid-template-columns: 1fr;
  }
  
  .comic-title {
    font-size: 2rem;
  }
  
  .section-header {
    font-size: 1.4rem;
  }
  
  .btn-comic {
    width: 100%;
    font-size: 1rem;
  }
  
  .nav-buttons {
    flex-direction: column;
  }
}

/* Screen transitions */
.screen {
  display: none;
  animation: fadeIn 0.3s ease-in;
}

.screen.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Progress Bar */
.progress-bar {
  background: var(--marvel-white);
  border: var(--border-comic);
  height: 30px;
  margin: 20px 0;
  position: relative;
  overflow: hidden;
}

.progress-fill {
  background: var(--marvel-red);
  height: 100%;
  transition: width 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--marvel-white);
  font-weight: bold;
}

/* Comic Effect Text */
.comic-effect {
  position: absolute;
  font-size: 3rem;
  color: var(--marvel-yellow);
  text-shadow: 3px 3px 0 var(--marvel-black);
  transform: rotate(-15deg);
  pointer-events: none;
  opacity: 0.3;
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// Constants - Data
const GENRES = [
  { id: 'melodrama', name: 'Мелодрама', desc: 'Эмоциональная история с акцентом на чувства и отношения. Подходит для трогательных моментов прощания со школой.' },
  { id: 'tragedy', name: 'Трагедия', desc: 'Серьезное произведение с драматическим финалом. Может символизировать конец школьной эпохи.' },
  { id: 'comedy', name: 'Комедия', desc: 'Юмористический сценарий с забавными ситуациями. Идеален для создания веселой атмосферы.' },
  { id: 'drama', name: 'Драма', desc: 'Серьезное произведение с глубоким сюжетом. Подходит для размышлений о взрослении.' },
  { id: 'fantasy', name: 'Фантастика', desc: 'Необычный мир с элементами фантастики. Позволяет создать уникальную атмосферу.' },
  { id: 'detective', name: 'Детектив', desc: 'Загадочная история с расследованием. Можно создать интригующий сценарий.' },
  { id: 'musical', name: 'Мюзикл', desc: 'Сценарий с песнями и танцами. Отлично подходит для творческого выступления.' },
  { id: 'action', name: 'Боевик', desc: 'Динамичный сценарий с яркими событиями. Для энергичного представления.' },
  { id: 'romance', name: 'Романтика', desc: 'История о любви и дружбе. Трогательные моменты школьных отношений.' },
  { id: 'satire', name: 'Сатира', desc: 'Юмористическое высмеивание недостатков. Можно обыграть школьные ситуации.' }
];

const STYLES = [
  { id: 'noir', name: 'Нуар', desc: 'Мрачный стиль 40-50-х годов с детективной атмосферой. Черно-белая эстетика.' },
  { id: 'nineties', name: '90-ые', desc: 'Яркий стиль девяностых с характерной музыкой и модой. Ностальгия по эпохе.' },
  { id: 'eighties', name: '80-ые', desc: 'Стиль восьмидесятых с неоновыми цветами и synthwave музыкой. Ретро-футуризм.' },
  { id: 'retro', name: 'Ретро', desc: 'Общий винтажный стиль прошлых десятилетий. Классическая эстетика.' },
  { id: 'futurism', name: 'Футуризм', desc: 'Стиль будущего с технологичными элементами. Современный и инновационный.' },
  { id: 'vintage', name: 'Винтаж', desc: 'Элегантный стиль прошлых эпох. Утонченная классика.' },
  { id: 'cyberpunk', name: 'Киберпанк', desc: 'Технологичный стиль с неоновыми огнями. Будущее высоких технологий.' },
  { id: 'steampunk', name: 'Стимпанк', desc: 'Викторианская эпоха с паровыми машинами. Альтернативная история.' },
  { id: 'grunge', name: 'Гранж', desc: 'Небрежный стиль 90-х с рок-эстетикой. Бунтарский дух.' },
  { id: 'popart', name: 'Поп-арт', desc: 'Яркий стиль поп-культуры с комиксами. Веселый и динамичный.' }
];

const CONCEPTS = [
  { id: 'zombies', name: 'Зомби', desc: 'Апокалипсис с зомби. Динамичный и захватывающий сценарий.' },
  { id: 'vampires', name: 'Вампиры', desc: 'Мистическая история о вампирах. Загадочная и романтичная атмосфера.' },
  { id: 'medieval', name: 'Средневековье', desc: 'Эпоха рыцарей и замков. Эпическое путешествие в прошлое.' },
  { id: 'superheroes', name: 'Супергерои', desc: 'История о супергероях спасających мир. Вдохновляющий сценарий.' },
  { id: 'space', name: 'Космос', desc: 'Путешествие в космос и другие планеты. Футуристическая атмосфера.' },
  { id: 'spies', name: 'Шпионы', desc: 'Шпионская история с секретами и миссиями. Интригующий сюжет.' },
  { id: 'pirates', name: 'Пираты', desc: 'Морские приключения пиратов. Свобода и дух авантюризма.' },
  { id: 'magic', name: 'Магия', desc: 'Волшебный мир магии и чародеев. Сказочная атмосфера.' },
  { id: 'robots', name: 'Роботы', desc: 'Мир роботов и искусственного интеллекта. Технологичный сценарий.' },
  { id: 'timetravel', name: 'Путешествия во времени', desc: 'Перемещение между эпохами. Увлекательное приключение.' }
];

// State
let state = {
  currentScreen: 'start',
  selectedGenres: [],
  selectedStyles: [],
  selectedConcepts: [],
  currentCategory: 'genres'
};

// Load from localStorage
function loadState() {
  const saved = localStorage.getItem('scenarioChoice');
  if (saved) {
    try {
      state = JSON.parse(saved);
    } catch (e) {
      console.error('Error loading state:', e);
    }
  }
}

// Save to localStorage
function saveState() {
  try {
    localStorage.setItem('scenarioChoice', JSON.stringify(state));
  } catch (e) {
    console.error('Error saving state:', e);
  }
}

// Render functions
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  
  switch (state.currentScreen) {
    case 'start':
      renderStartScreen(app);
      break;
    case 'selection':
      renderSelectionScreen(app);
      break;
    case 'final':
      renderFinalScreen(app);
      break;
  }
}

function renderStartScreen(container) {
  const screen = document.createElement('main');
  screen.className = 'screen active start-screen';
  screen.setAttribute('role', 'main');
  
  screen.innerHTML = `
    <div class="comic-panel">
      <h1 class="start-logo">ЧАС ОБЩЕНИЯ</h1>
      <h2 class="comic-subtitle">Выбор сценария для последнего звонка</h2>
      
      <div class="speech-bubble">
        <p style="font-size: 1.1rem; line-height: 1.6;">
          Привет, одиннадцатиклассники! Пришло время создать незабываемый сценарий для вашего последнего звонка! 
          Вместе мы выберем лучшие жанры, стили и концепции для вашего праздника.
        </p>
      </div>
      
      <div class="comic-panel" style="margin: 30px 0;">
        <h3 style="color: var(--marvel-blue); font-size: 1.5rem; margin-bottom: 15px; text-transform: uppercase;">
          Что вас ждет:
        </h3>
        <ul style="list-style: none; padding: 0; text-align: left; max-width: 500px; margin: 0 auto;">
          <li style="padding: 10px; margin: 10px 0; background: var(--marvel-yellow); border: 2px solid var(--marvel-black);">
            📚 10 жанров для выбора
          </li>
          <li style="padding: 10px; margin: 10px 0; background: var(--marvel-yellow); border: 2px solid var(--marvel-black);">
            🎨 10 стилей оформления
          </li>
          <li style="padding: 10px; margin: 10px 0; background: var(--marvel-yellow); border: 2px solid var(--marvel-black);">
            🎭 10 концепций сценария
          </li>
          <li style="padding: 10px; margin: 10px 0; background: var(--marvel-yellow); border: 2px solid var(--marvel-black);">
            ⭐ Финальный выбор топ-3 в каждой категории
          </li>
        </ul>
      </div>
      
      <button class="btn-comic" id="startBtn" aria-label="Начать выбор сценария">
        НАЧАТЬ ВЫБОР!
      </button>
    </div>
  `;
  
  container.appendChild(screen);
  
  document.getElementById('startBtn').addEventListener('click', () => {
    state.currentScreen = 'selection';
    state.currentCategory = 'genres';
    saveState();
    render();
  });
}

function renderSelectionScreen(container) {
  const screen = document.createElement('main');
  screen.className = 'screen active';
  screen.setAttribute('role', 'main');
  
  let data, selectedItems, title, category;
  
  if (state.currentCategory === 'genres') {
    data = GENRES;
    selectedItems = state.selectedGenres;
    title = 'ЖАНРЫ';
    category = 'genres';
  } else if (state.currentCategory === 'styles') {
    data = STYLES;
    selectedItems = state.selectedStyles;
    title = 'СТИЛИ';
    category = 'styles';
  } else {
    data = CONCEPTS;
    selectedItems = state.selectedConcepts;
    title = 'КОНЦЕПЦИИ';
    category = 'concepts';
  }
  
  screen.innerHTML = `
    <div class="comic-panel">
      <h1 class="comic-title">ВЫБОР: ${title}</h1>
      
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${state.currentCategory === 'genres' ? '33' : state.currentCategory === 'styles' ? '66' : '100'}%">
          ${state.currentCategory === 'genres' ? '1/3' : state.currentCategory === 'styles' ? '2/3' : '3/3'}
        </div>
      </div>
      
      <div class="speech-bubble">
        <p style="font-size: 1.1rem;">
          Выберите подходящие варианты для вашего класса. Можно выбрать несколько!
        </p>
      </div>
      
      <div class="counter">
        Выбрано: <span id="counter">${selectedItems.length}</span>
      </div>
      
      <div class="cards-grid" id="cardsGrid">
        ${data.map(item => `
          <div class="card ${selectedItems.includes(item.id) ? 'selected' : ''}" 
               data-id="${item.id}" 
               role="button" 
               tabindex="0"
               aria-pressed="${selectedItems.includes(item.id)}">
            <div class="card-checkbox">
              ${selectedItems.includes(item.id) ? '✓' : ''}
            </div>
            <h3 class="card-title">${item.name}</h3>
            <p class="card-description">${item.desc}</p>
          </div>
        `).join('')}
      </div>
      
      <div class="nav-buttons">
        ${state.currentCategory !== 'genres' ? `
          <button class="btn-comic btn-blue" id="prevBtn" aria-label="Предыдущая категория">
            ← НАЗАД
          </button>
        ` : ''}
        
        ${state.currentCategory !== 'concepts' ? `
          <button class="btn-comic" id="nextBtn" aria-label="Следующая категория">
            ДАЛЕЕ →
          </button>
        ` : `
          <button class="btn-comic" id="finalBtn" aria-label="Показать результаты">
            ПОКАЗАТЬ РЕЗУЛЬТАТ!
          </button>
        `: null}
      </div>
    </div>
  `;
  
  container.appendChild(screen);
  
  // Card click handlers
  const cards = screen.querySelectorAll('.card');
  cards.forEach(card => {
    const handleClick = () => {
      const id = card.dataset.id;
      const index = selectedItems.indexOf(id);
      
      if (index > -1) {
        selectedItems.splice(index, 1);
      } else {
        selectedItems.push(id);
      }
      
      saveState();
      render();
    };
    
    card.addEventListener('click', handleClick);
    card.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleClick();
      }
    });
  });
  
  // Navigation handlers
  const prevBtn = screen.querySelector('#prevBtn');
  const nextBtn = screen.querySelector('#nextBtn');
  const finalBtn = screen.querySelector('#finalBtn');
  
  if (prevBtn) {
    prevBtn.addEventListener('click', () => {
      if (state.currentCategory === 'styles') {
        state.currentCategory = 'genres';
      } else if (state.currentCategory === 'concepts') {
        state.currentCategory = 'styles';
      }
      saveState();
      render();
    });
  }
  
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (state.currentCategory === 'genres') {
        state.currentCategory = 'styles';
      } else if (state.currentCategory === 'styles') {
        state.currentCategory = 'concepts';
      }
      saveState();
      render();
    });
  }
  
  if (finalBtn) {
    finalBtn.addEventListener('click', () => {
      state.currentScreen = 'final';
      saveState();
      render();
    });
  }
}

function renderFinalScreen(container) {
  const screen = document.createElement('main');
  screen.className = 'screen active';
  screen.setAttribute('role', 'main');
  
  const topGenres = state.selectedGenres.slice(0, 3);
  const topStyles = state.selectedStyles.slice(0, 3);
  const topConcepts = state.selectedConcepts.slice(0, 3);
  
  screen.innerHTML = `
    <div class="comic-panel">
      <h1 class="comic-title">ВАШ ВЫБОР!</h1>
      
      <div class="speech-bubble">
        <p style="font-size: 1.1rem;">
          Отличный выбор! Вот ваши топ-3 варианта в каждой категории для создания незабываемого последнего звонка!
        </p>
      </div>
      
      ${topGenres.length > 0 ? `
        <div class="results-section">
          <h2 class="results-title">📚 ТОП-3 ЖАНРА</h2>
          <ul class="results-list">
            ${topGenres.map((id, index) => {
              const genre = GENRES.find(g => g.id === id);
              return `
                <li class="results-item">
                  <div class="results-item-number">${index + 1}</div>
                  <div>
                    <strong>${genre.name}</strong>
                    <p style="font-size: 0.9rem; margin-top: 5px; font-family: Arial, sans-serif;">${genre.desc}</p>
                  </div>
                </li>
              `;
            }).join('')}
          </ul>
        </div>
      ` : '<div class="empty-state">Не выбрано ни одного жанра</div>'}
      
      ${topStyles.length > 0 ? `
        <div class="results-section">
          <h2 class="results-title">🎨 ТОП-3 СТИЛЯ</h2>
          <ul class="results-list">
            ${topStyles.map((id, index) => {
              const style = STYLES.find(s => s.id === id);
              return `
                <li class="results-item">
                  <div class="results-item-number">${index + 1}</div>
                  <div>
                    <strong>${style.name}</strong>
                    <p style="font-size: 0.9rem; margin-top: 5px; font-family: Arial, sans-serif;">${style.desc}</p>
                  </div>
                </li>
              `;
            }).join('')}
          </ul>
        </div>
      ` : '<div class="empty-state">Не выбрано ни одного стиля</div>'}
      
      ${topConcepts.length > 0 ? `
        <div class="results-section">
          <h2 class="results-title">🎭 ТОП-3 КОНЦЕПЦИИ</h2>
          <ul class="results-list">
            ${topConcepts.map((id, index) => {
              const concept = CONCEPTS.find(c => c.id === id);
              return `
                <li class="results-item">
                  <div class="results-item-number">${index + 1}</div>
                  <div>
                    <strong>${concept.name}</strong>
                    <p style="font-size: 0.9rem; margin-top: 5px; font-family: Arial, sans-serif;">${concept.desc}</p>
                  </div>
                </li>
              `;
            }).join('')}
          </ul>
        </div>
      ` : '<div class="empty-state">Не выбрано ни одной концепции</div>'}
      
      <div class="nav-buttons">
        <button class="btn-comic btn-blue" id="backBtn" aria-label="Вернуться к выбору">
          ← ВЕРНУТЬСЯ К ВЫБОРУ
        </button>
        <button class="btn-comic" id="restartBtn" aria-label="Начать заново">
          НАЧАТЬ ЗАНОВО
        </button>
      </div>
    </div>
  `;
  
  container.appendChild(screen);
  
  document.getElementById('backBtn').addEventListener('click', () => {
    state.currentScreen = 'selection';
    state.currentCategory = 'genres';
    saveState();
    render();
  });
  
  document.getElementById('restartBtn').addEventListener('click', () => {
    if (confirm('Вы уверены, что хотите начать заново? Все выборы будут сброшены.')) {
      state = {
        currentScreen: 'start',
        selectedGenres: [],
        selectedStyles: [],
        selectedConcepts: [],
        currentCategory: 'genres'
      };
      saveState();
      render();
    }
  });
}

// Initialize
function init() {
  loadState();
  render();
}

init();
</script>
</body>
</html>
