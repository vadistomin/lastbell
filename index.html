<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Час Общения: Выбор Сценария</title>
<style>
:root {
  --marvel-red: #e62429;
  --marvel-yellow: #ffc20e;
  --marvel-blue: #0033a0;
  --marvel-black: #000000;
  --marvel-white: #ffffff;
  --shadow-comic: 4px 4px 0px var(--marvel-black);
  --border-comic: 3px solid var(--marvel-black);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
  background: var(--marvel-yellow);
  background-image: 
    radial-gradient(circle, var(--marvel-black) 1px, transparent 1px);
  background-size: 20px 20px;
  min-height: 100vh;
  color: var(--marvel-black);
  line-height: 1.4;
}

#app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.comic-panel {
  background: var(--marvel-white);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  padding: 20px;
  margin-bottom: 20px;
  position: relative;
}

.comic-title {
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: var(--marvel-red);
  text-shadow: 
    3px 3px 0 var(--marvel-yellow),
    6px 6px 0 var(--marvel-black);
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
  transform: skewY(-2deg);
}

.comic-subtitle {
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  color: var(--marvel-blue);
  text-align: center;
  margin-bottom: 30px;
  text-transform: uppercase;
}

.speech-bubble {
  background: var(--marvel-white);
  border: var(--border-comic);
  border-radius: 20px;
  padding: 15px 20px;
  position: relative;
  margin: 20px 0;
  box-shadow: var(--shadow-comic);
}

.btn-comic {
  background: var(--marvel-red);
  color: var(--marvel-white);
  border: var(--border-comic);
  padding: 15px 30px;
  font-size: 1.2rem;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: var(--shadow-comic);
  transition: all 0.1s;
  min-height: 44px;
  min-width: 44px;
  letter-spacing: 1px;
  font-family: 'Arial Black', Arial, sans-serif;
}

.btn-comic:hover {
  transform: translate(2px, 2px);
  box-shadow: 2px 2px 0px var(--marvel-black);
}

.btn-comic:active {
  transform: translate(4px, 4px);
  box-shadow: none;
}

.btn-comic:focus-visible {
  outline: 3px dashed var(--marvel-yellow);
  outline-offset: 3px;
}

.btn-comic.btn-blue {
  background: var(--marvel-blue);
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  margin: 20px 0;
}

.card {
  background: var(--marvel-white);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  user-select: none;
}

.card:hover {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px var(--marvel-black);
}

.card.selected {
  background: var(--marvel-yellow);
  border-color: var(--marvel-red);
  border-width: 5px;
}

.card-title {
  font-size: 1.5rem;
  color: var(--marvel-red);
  margin-bottom: 10px;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

.card-description {
  font-size: 1rem;
  color: var(--marvel-black);
  line-height: 1.5;
  position: relative;
  z-index: 1;
  font-family: Arial, sans-serif;
  font-weight: normal;
}

.card-checkbox {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  background: var(--marvel-white);
  border: var(--border-comic);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  z-index: 2;
}

.card.selected .card-checkbox {
  background: var(--marvel-red);
  color: var(--marvel-white);
}

.section-header {
  background: var(--marvel-blue);
  color: var(--marvel-yellow);
  padding: 15px 20px;
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  margin-bottom: 20px;
  font-size: 1.8rem;
  text-transform: uppercase;
  text-align: center;
  letter-spacing: 2px;
}

.counter {
  background: var(--marvel-red);
  color: var(--marvel-white);
  padding: 10px 20px;
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  display: inline-block;
  font-size: 1.2rem;
  margin: 10px 0;
  text-transform: uppercase;
}

.nav-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 30px 0;
}

.results-section {
  background: var(--marvel-white);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  padding: 20px;
  margin-bottom: 20px;
}

.results-title {
  font-size: 1.8rem;
  color: var(--marvel-blue);
  margin-bottom: 15px;
  text-transform: uppercase;
  text-align: center;
}

.results-list {
  list-style: none;
  padding: 0;
}

.results-item {
  background: var(--marvel-yellow);
  border: var(--border-comic);
  padding: 15px;
  margin-bottom: 10px;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  gap: 10px;
}

.results-item-number {
  background: var(--marvel-red);
  color: var(--marvel-white);
  width: 40px;
  height: 40px;
  border: var(--border-comic);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: bold;
  flex-shrink: 0;
}

.start-screen {
  text-align: center;
  padding: 40px 20px;
}

.start-logo {
  font-size: clamp(3rem, 8vw, 5rem);
  color: var(--marvel-red);
  text-shadow: 
    4px 4px 0 var(--marvel-yellow),
    8px 8px 0 var(--marvel-black);
  margin-bottom: 30px;
  letter-spacing: 3px;
  transform: skewY(-3deg);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: skewY(-3deg) scale(1); }
  50% { transform: skewY(-3deg) scale(1.05); }
}

.start-description {
  font-size: 1.2rem;
  max-width: 600px;
  margin: 0 auto 30px;
  line-height: 1.6;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--marvel-blue);
  font-size: 1.2rem;
}

.screen {
  display: none;
  animation: fadeIn 0.3s ease-in;
}

.screen.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.progress-bar {
  background: var(--marvel-white);
  border: var(--border-comic);
  height: 30px;
  margin: 20px 0;
  position: relative;
  overflow: hidden;
}

.progress-fill {
  background: var(--marvel-red);
  height: 100%;
  transition: width 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--marvel-white);
  font-weight: bold;
}

@media (max-width: 600px) {
  .cards-grid {
    grid-template-columns: 1fr;
  }
  
  .comic-title {
    font-size: 2rem;
  }
  
  .section-header {
    font-size: 1.4rem;
  }
  
  .btn-comic {
    width: 100%;
    font-size: 1rem;
  }
  
  .nav-buttons {
    flex-direction: column;
  }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const GENRES = [
  { id: 'melodrama', name: 'Мелодрама', desc: 'Эмоциональная история с акцентом на чувства и отношения. Подходит для трогательных моментов прощания со школой.' },
  { id: 'tragedy', name: 'Трагедия', desc: 'Серьезное произведение с драматическим финалом. Может символизировать конец школьной эпохи.' },
  { id: 'comedy', name: 'Комедия', desc: 'Юмористический сценарий с забавными ситуациями. Идеален для создания веселой атмосферы.' },
  { id: 'drama', name: 'Драма', desc: 'Серьезное произведение с глубоким сюжетом. Подходит для размышлений о взрослении.' },
  { id: 'fantasy', name: 'Фантастика', desc: 'Необычный мир с элементами фантастики. Позволяет создать уникальную атмосферу.' },
  { id: 'detective', name: 'Детектив', desc: 'Загадочная история с расследованием. Можно создать интригующий сценарий.' },
  { id: 'musical', name: 'Мюзикл', desc: 'Сценарий с песнями и танцами. Отлично подходит для творческого выступления.' },
  { id: 'action', name: 'Боевик', desc: 'Динамичный сценарий с яркими событиями. Для энергичного представления.' },
  { id: 'romance', name: 'Романтика', desc: 'История о любви и дружбе. Трогательные моменты школьных отношений.' },
  { id: 'satire', name: 'Сатира', desc: 'Юмористическое высмеивание недостатков. Можно обыграть школьные ситуации.' }
];

const STYLES = [
  { id: 'noir', name: 'Нуар', desc: 'Мрачный стиль 40-50-х годов с детективной атмосферой. Черно-белая эстетика.' },
  { id: 'nineties', name: '90-ые', desc: 'Яркий стиль девяностых с характерной музыкой и модой. Ностальгия по эпохе.' },
  { id: 'eighties', name: '80-ые', desc: 'Стиль восьмидесятых с неоновыми цветами и synthwave музыкой. Ретро-футуризм.' },
  { id: 'retro', name: 'Ретро', desc: 'Общий винтажный стиль прошлых десятилетий. Классическая эстетика.' },
  { id: 'futurism', name: 'Футуризм', desc: 'Стиль будущего с технологичными элементами. Современный и инновационный.' },
  { id: 'vintage', name: 'Винтаж', desc: 'Элегантный стиль прошлых эпох. Утонченная классика.' },
  { id: 'cyberpunk', name: 'Киберпанк', desc: 'Технологичный стиль с неоновыми огнями. Будущее высоких технологий.' },
  { id: 'steampunk', name: 'Стимпанк', desc: 'Викторианская эпоха с паровыми машинами. Альтернативная история.' },
  { id: 'grunge', name: 'Гранж', desc: 'Небрежный стиль 90-х с рок-эстетикой. Бунтарский дух.' },
  { id: 'popart', name: 'Поп-арт', desc: 'Яркий стиль поп-культуры с комиксами. Веселый и динамичный.' }
];

const CONCEPTS = [
  { id: 'zombies', name: 'Зомби', desc: 'Апокалипсис с зомби. Динамичный и захватывающий сценарий.' },
  { id: 'vampires', name: 'Вампиры', desc: 'Мистическая история о вампирах. Загадочная и романтичная атмосфера.' },
  { id: 'medieval', name: 'Средневековье', desc: 'Эпоха рыцарей и замков. Эпическое путешествие в прошлое.' },
  { id: 'superheroes', name: 'Супергерои', desc: 'История о супергероях спасющих мир. Вдохновляющий сценарий.' },
  { id: 'space', name: 'Космос', desc: 'Путешествие в космос и другие планеты. Футуристическая атмосфера.' },
  { id: 'spies', name: 'Шпионы', desc: 'Шпионская история с секретами и миссиями. Интригующий сюжет.' },
  { id: 'pirates', name: 'Пираты', desc: 'Морские приключения пиратов. Свобода и дух авантюризма.' },
  { id: 'magic', name: 'Магия', desc: 'Волшебный мир магии и чародеев. Сказочная атмосфера.' },
  { id: 'robots', name: 'Роботы', desc: 'Мир роботов и искусственного интеллекта. Технологичный сценарий.' },
  { id: 'timetravel', name: 'Путешествия во времени', desc: 'Перемещение между эпохами. Увлекательное приключение.' }
];

let state = {
  currentScreen: 'start',
  selectedGenres: [],
  selectedStyles: [],
  selectedConcepts: [],
  currentCategory: 'genres'
};

function loadState() {
  try {
    const saved = localStorage.getItem('scenarioChoice');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = parsed;
    }
  } catch (e) {
    console.error('Error loading state:', e);
  }
}

function saveState() {
  try {
    localStorage.setItem('scenarioChoice', JSON.stringify(state));
  } catch (e) {
    console.error('Error saving state:', e);
  }
}

function clearApp() {
  const app = document.getElementById('app');
  while (app.firstChild) {
    app.removeChild(app.firstChild);
  }
}

function createStartScreen() {
  const screen = document.createElement('main');
  screen.className = 'screen active start-screen';
  screen.setAttribute('role', 'main');
  
  const panel = document.createElement('div');
  panel.className = 'comic-panel';
  
  const logo = document.createElement('h1');
  logo.className = 'start-logo';
  logo.textContent = 'ЧАС ОБЩЕНИЯ';
  panel.appendChild(logo);
  
  const subtitle = document.createElement('h2');
  subtitle.className = 'comic-subtitle';
  subtitle.textContent = 'Выбор сценария для последнего звонка';
  panel.appendChild(subtitle);
  
  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  const bubbleText = document.createElement('p');
  bubbleText.style.fontSize = '1.1rem';
  bubbleText.style.lineHeight = '1.6';
  bubbleText.textContent = 'Привет, одиннадцатиклассники! Пришло время создать незабываемый сценарий для вашего последнего звонка! Вместе мы выберем лучшие жанры, стили и концепции для вашего праздника.';
  bubble.appendChild(bubbleText);
  panel.appendChild(bubble);
  
  const infoPanel = document.createElement('div');
  infoPanel.className = 'comic-panel';
  infoPanel.style.margin = '30px 0';
  
  const infoTitle = document.createElement('h3');
  infoTitle.style.color = 'var(--marvel-blue)';
  infoTitle.style.fontSize = '1.5rem';
  infoTitle.style.marginBottom = '15px';
  infoTitle.style.textTransform = 'uppercase';
  infoTitle.textContent = 'Что вас ждет:';
  infoPanel.appendChild(infoTitle);
  
  const list = document.createElement('ul');
  list.style.listStyle = 'none';
  list.style.padding = '0';
  list.style.textAlign = 'left';
  list.style.maxWidth = '500px';
  list.style.margin = '0 auto';
  
  const items = [
    '📚 10 жанров для выбора',
    ' 10 стилей оформления',
    ' 10 концепций сценария',
    '⭐ Финальный выбор топ-3 в каждой категории'
  ];
  
  items.forEach(itemText => {
    const li = document.createElement('li');
    li.style.padding = '10px';
    li.style.margin = '10px 0';
    li.style.background = 'var(--marvel-yellow)';
    li.style.border = '2px solid var(--marvel-black)';
    li.textContent = itemText;
    list.appendChild(li);
  });
  
  infoPanel.appendChild(list);
  panel.appendChild(infoPanel);
  
  const startBtn = document.createElement('button');
  startBtn.className = 'btn-comic';
  startBtn.id = 'startBtn';
  startBtn.setAttribute('aria-label', 'Начать выбор сценария');
  startBtn.textContent = 'НАЧАТЬ ВЫБОР!';
  startBtn.addEventListener('click', () => {
    state.currentScreen = 'selection';
    state.currentCategory = 'genres';
    saveState();
    render();
  });
  panel.appendChild(startBtn);
  
  screen.appendChild(panel);
  return screen;
}

function createCard(item, isSelected) {
  const card = document.createElement('div');
  card.className = 'card' + (isSelected ? ' selected' : '');
  card.dataset.id = item.id;
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-pressed', isSelected.toString());
  
  const checkbox = document.createElement('div');
  checkbox.className = 'card-checkbox';
  checkbox.textContent = isSelected ? '✓' : '';
  card.appendChild(checkbox);
  
  const title = document.createElement('h3');
  title.className = 'card-title';
  title.textContent = item.name;
  card.appendChild(title);
  
  const desc = document.createElement('p');
  desc.className = 'card-description';
  desc.textContent = item.desc;
  card.appendChild(desc);
  
  return card;
}

function createSelectionScreen() {
  const screen = document.createElement('main');
  screen.className = 'screen active';
  screen.setAttribute('role', 'main');
  
  let data, selectedItems, title;
  
  if (state.currentCategory === 'genres') {
    data = GENRES;
    selectedItems = state.selectedGenres;
    title = 'ЖАНРЫ';
  } else if (state.currentCategory === 'styles') {
    data = STYLES;
    selectedItems = state.selectedStyles;
    title = 'СТИЛИ';
  } else {
    data = CONCEPTS;
    selectedItems = state.selectedConcepts;
    title = 'КОНЦЕПЦИИ';
  }
  
  const panel = document.createElement('div');
  panel.className = 'comic-panel';
  
  const heading = document.createElement('h1');
  heading.className = 'comic-title';
  heading.textContent = 'ВЫБОР: ' + title;
  panel.appendChild(heading);
  
  const progress = document.createElement('div');
  progress.className = 'progress-bar';
  const progressFill = document.createElement('div');
  progressFill.className = 'progress-fill';
  
  let progressWidth, progressText;
  if (state.currentCategory === 'genres') {
    progressWidth = '33';
    progressText = '1/3';
  } else if (state.currentCategory === 'styles') {
    progressWidth = '66';
    progressText = '2/3';
  } else {
    progressWidth = '100';
    progressText = '3/3';
  }
  
  progressFill.style.width = progressWidth + '%';
  progressFill.textContent = progressText;
  progress.appendChild(progressFill);
  panel.appendChild(progress);
  
  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  const bubbleText = document.createElement('p');
  bubbleText.style.fontSize = '1.1rem';
  bubbleText.textContent = 'Выберите подходящие варианты для вашего класса. Можно выбрать несколько!';
  bubble.appendChild(bubbleText);
  panel.appendChild(bubble);
  
  const counter = document.createElement('div');
  counter.className = 'counter';
  counter.textContent = 'Выбрано: ';
  const counterSpan = document.createElement('span');
  counterSpan.id = 'counter';
  counterSpan.textContent = selectedItems.length.toString();
  counter.appendChild(counterSpan);
  panel.appendChild(counter);
  
  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  grid.id = 'cardsGrid';
  
  data.forEach(item => {
    const isSelected = selectedItems.includes(item.id);
    const card = createCard(item, isSelected);
    
    const handleClick = () => {
      const id = card.dataset.id;
      const index = selectedItems.indexOf(id);
      
      if (index > -1) {
        selectedItems.splice(index, 1);
      } else {
        selectedItems.push(id);
      }
      
      saveState();
      render();
    };
    
    card.addEventListener('click', handleClick);
    card.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleClick();
      }
    });
    
    grid.appendChild(card);
  });
  
  panel.appendChild(grid);
  
  const navButtons = document.createElement('div');
  navButtons.className = 'nav-buttons';
  
  if (state.currentCategory !== 'genres') {
    const prevBtn = document.createElement('button');
    prevBtn.className = 'btn-comic btn-blue';
    prevBtn.setAttribute('aria-label', 'Предыдущая категория');
    prevBtn.textContent = '← НАЗАД';
    prevBtn.addEventListener('click', () => {
      if (state.currentCategory === 'styles') {
        state.currentCategory = 'genres';
      } else if (state.currentCategory === 'concepts') {
        state.currentCategory = 'styles';
      }
      saveState();
      render();
    });
    navButtons.appendChild(prevBtn);
  }
  
  if (state.currentCategory !== 'concepts') {
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn-comic';
    nextBtn.setAttribute('aria-label', 'Следующая категория');
    nextBtn.textContent = 'ДАЛЕЕ →';
    nextBtn.addEventListener('click', () => {
      if (state.currentCategory === 'genres') {
        state.currentCategory = 'styles';
      } else if (state.currentCategory === 'styles') {
        state.currentCategory = 'concepts';
      }
      saveState();
      render();
    });
    navButtons.appendChild(nextBtn);
  } else {
    const finalBtn = document.createElement('button');
    finalBtn.className = 'btn-comic';
    finalBtn.setAttribute('aria-label', 'Показать результаты');
    finalBtn.textContent = 'ПОКАЗАТЬ РЕЗУЛЬТАТ!';
    finalBtn.addEventListener('click', () => {
      state.currentScreen = 'final';
      saveState();
      render();
    });
    navButtons.appendChild(finalBtn);
  }
  
  panel.appendChild(navButtons);
  screen.appendChild(panel);
  
  return screen;
}

function createResultsSection(title, emoji, items, data) {
  const section = document.createElement('div');
  section.className = 'results-section';
  
  const heading = document.createElement('h2');
  heading.className = 'results-title';
  heading.textContent = emoji + ' ' + title;
  section.appendChild(heading);
  
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Не выбрано ни одного варианта';
    section.appendChild(empty);
  } else {
    const list = document.createElement('ul');
    list.className = 'results-list';
    
    items.slice(0, 3).forEach((id, index) => {
      const item = data.find(d => d.id === id);
      if (item) {
        const li = document.createElement('li');
        li.className = 'results-item';
        
        const number = document.createElement('div');
        number.className = 'results-item-number';
        number.textContent = (index + 1).toString();
        li.appendChild(number);
        
        const content = document.createElement('div');
        
        const name = document.createElement('strong');
        name.textContent = item.name;
        content.appendChild(name);
        
        const desc = document.createElement('p');
        desc.style.fontSize = '0.9rem';
        desc.style.marginTop = '5px';
        desc.style.fontFamily = 'Arial, sans-serif';
        desc.textContent = item.desc;
        content.appendChild(desc);
        
        li.appendChild(content);
        list.appendChild(li);
      }
    });
    
    section.appendChild(list);
  }
  
  return section;
}

function createFinalScreen() {
  const screen = document.createElement('main');
  screen.className = 'screen active';
  screen.setAttribute('role', 'main');
  
  const panel = document.createElement('div');
  panel.className = 'comic-panel';
  
  const heading = document.createElement('h1');
  heading.className = 'comic-title';
  heading.textContent = 'ВАШ ВЫБОР!';
  panel.appendChild(heading);
  
  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  const bubbleText = document.createElement('p');
  bubbleText.style.fontSize = '1.1rem';
  bubbleText.textContent = 'Отличный выбор! Вот ваши топ-3 варианта в каждой категории для создания незабываемого последнего звонка!';
  bubble.appendChild(bubbleText);
  panel.appendChild(bubble);
  
  panel.appendChild(createResultsSection('ТОП-3 ЖАНРА', '📚', state.selectedGenres, GENRES));
  panel.appendChild(createResultsSection('ТОП-3 СТИЛЯ', '', state.selectedStyles, STYLES));
  panel.appendChild(createResultsSection('ТОП-3 КОНЦЕПЦИИ', '🎭', state.selectedConcepts, CONCEPTS));
  
  const navButtons = document.createElement('div');
  navButtons.className = 'nav-buttons';
  
  const backBtn = document.createElement('button');
  backBtn.className = 'btn-comic btn-blue';
  backBtn.setAttribute('aria-label', 'Вернуться к выбору');
  backBtn.textContent = '← ВЕРНУТЬСЯ К ВЫБОРУ';
  backBtn.addEventListener('click', () => {
    state.currentScreen = 'selection';
    state.currentCategory = 'genres';
    saveState();
    render();
  });
  navButtons.appendChild(backBtn);
  
  const restartBtn = document.createElement('button');
  restartBtn.className = 'btn-comic';
  restartBtn.setAttribute('aria-label', 'Начать заново');
  restartBtn.textContent = 'НАЧАТЬ ЗАНОВО';
  restartBtn.addEventListener('click', () => {
    if (confirm('Вы уверены, что хотите начать заново? Все выборы будут сброшены.')) {
      state = {
        currentScreen: 'start',
        selectedGenres: [],
        selectedStyles: [],
        selectedConcepts: [],
        currentCategory: 'genres'
      };
      saveState();
      render();
    }
  });
  navButtons.appendChild(restartBtn);
  
  panel.appendChild(navButtons);
  screen.appendChild(panel);
  
  return screen;
}

function render() {
  clearApp();
  
  let screen;
  if (state.currentScreen === 'start') {
    screen = createStartScreen();
  } else if (state.currentScreen === 'selection') {
    screen = createSelectionScreen();
  } else if (state.currentScreen === 'final') {
    screen = createFinalScreen();
  }
  
  if (screen) {
    document.getElementById('app').appendChild(screen);
  }
}

function init() {
  loadState();
  render();
}

init();
</script>
</body>
</html>
